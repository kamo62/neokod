packages:
  - apps/*
  - oxlint-plugin-neokod
  - packages/*
  - scripts

# Supply-chain cooldown. Value is in MINUTES; 5760 = 4 days. Applies to all
# dependencies including transitive ones, which is the point: the August 2026
# keyv/cacheable compromise arrived through transitive deps via preinstall
# hooks, and was caught and reported within hours of publication.
# pnpm 11 already defaults this to 1440 (1 day); 4 days is deliberately wider.
#
# Why 4 and not 7: a 7-day window rejected 20 packages already pinned in the
# committed lockfile (@github/copilot@1.0.76 and @koromix/koffi@3.1.3 with
# their platform binaries, all published 2026-07-30), which blocked installs
# and therefore the whole test suite. 4 days clears those while still being
# far wider than the hours-old exposure window this protects against.
minimumReleaseAge: 5760

# Provider SDK platform binaries are >100MB tarballs; the default 60s
# per-fetch cap aborts them on slower connections. 10 minutes per fetch,
# fewer parallel downloads so each one gets the bandwidth to finish.
fetchTimeout: 600000
networkConcurrency: 4

# Fail resolution rather than silently installing a too-new version when no
# version satisfies the age constraint. This is the default once
# minimumReleaseAge is set explicitly, stated here so it survives edits.
minimumReleaseAgeStrict: true

# Packages whose registry metadata has no `time` field skip the age check by
# default, which is a fail-open hole: an attacker controlling the metadata is
# exactly who benefits from it. false makes a missing timestamp a resolution
# failure instead.
# If a legitimate dependency without timestamps blocks an install, prefer
# adding it to minimumReleaseAgeExclude below over flipping this back to true.
minimumReleaseAgeIgnoreMissingTime: false

# Exempt specific packages from the cooldown when you genuinely need a fresh
# release (security patch, blocking bugfix). Supports names, `@scope/*`
# patterns, and pinned versions such as `pkg@1.2.3`.
# 2026-08-08: Kamogelo approved taking these three SDK releases ahead of the
# 4-day window. Pinned versions so the exemption dies with the upgrade.
minimumReleaseAgeExclude:
  - "@github/copilot-sdk@1.0.9"
  - "@opencode-ai/sdk@1.18.15"
  - "@anthropic-ai/claude-agent-sdk@0.3.226"
  # The SDK's per-platform binary packages ship the same version in lockstep;
  # pnpm rejects pattern+version combined, so this family is name-matched only.
  # Remove together with the pinned entries above once 0.3.226 clears cooldown.
  - "@anthropic-ai/claude-agent-sdk-*"

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  # Pulled in by @github/copilot-sdk. Denied deliberately: koffi ships its
  # native binary as per-platform @koromix/koffi-* packages that its loader
  # resolves at require time, so the install script only matters as a source-
  # build fallback. Allowing it broke the macOS x64 release, where the
  # prebuilt failed to load and the source build then failed to link.
  koffi: false
  msgpackr-extract: true
  msw: false
  node-pty: true
  sharp: true
  utf-8-validate: false
  workerd: false

catalog:
  "@effect/atom-react": 4.0.0-beta.78
  "@effect/openapi-generator": 4.0.0-beta.78
  "@effect/platform-bun": 4.0.0-beta.78
  "@effect/platform-node": 4.0.0-beta.78
  "@effect/platform-node-shared": 4.0.0-beta.78
  "@effect/sql-sqlite-bun": 4.0.0-beta.78
  "@effect/tsgo": 0.13.2
  "@effect/vitest": 4.0.0-beta.78
  "@pierre/diffs": 1.3.0-beta.5
  "@types/node": 24.12.4
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  effect: 4.0.0-beta.78
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2
  yaml: ^2.9.0

overrides:
  "@effect/atom-react": "catalog:"
  "@effect/platform-bun": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-sqlite-bun": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  yaml: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.0-beta.78": patches/@effect__vitest@4.0.0-beta.78.patch
  "@ff-labs/fff-node@0.9.4": patches/@ff-labs__fff-node@0.9.4.patch
  "@pierre/diffs@1.3.0-beta.5": patches/@pierre%2Fdiffs@1.3.0-beta.5.patch
  effect@4.0.0-beta.78: patches/effect@4.0.0-beta.78.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
